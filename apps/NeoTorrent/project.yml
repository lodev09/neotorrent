name: NeoTorrent
options:
  bundleIdPrefix: com.lodev09
  deploymentTarget:
    macOS: "15.0"
  developmentLanguage: en
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.10"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: YES
    SWIFT_STRICT_CONCURRENCY: complete

targets:
  NeoTorrent:
    type: application
    platform: macOS
    sources:
      - path: NeoTorrent
        excludes:
          - "Generated"
      # Produced by the "Build Rust core" phase; may not exist at generation time.
      - path: NeoTorrent/Generated/neotorrent_ffi.swift
        optional: true
    info:
      path: NeoTorrent/Info.plist
      properties:
        CFBundleDisplayName: NeoTorrent
        CFBundleShortVersionString: "0.1.4"
        CFBundleVersion: "5"
        CFBundlePackageType: APPL
        LSApplicationCategoryType: public.app-category.utilities
        NSHumanReadableCopyright: "Copyright © 2026 Jovanni Lo"
        # Register neotorrent as the handler for magnet: links.
        CFBundleURLTypes:
          - CFBundleURLName: com.lodev09.neotorrent.magnet
            CFBundleTypeRole: Viewer
            CFBundleURLSchemes:
              - magnet
        # Register neotorrent as a handler for .torrent files.
        CFBundleDocumentTypes:
          - CFBundleTypeName: BitTorrent file
            CFBundleTypeRole: Viewer
            LSHandlerRank: Default
            LSItemContentTypes:
              - org.bittorrent.torrent
            CFBundleTypeExtensions:
              - torrent
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: org.bittorrent.torrent
            UTTypeDescription: BitTorrent file
            UTTypeConformsTo:
              - public.data
            UTTypeTagSpecification:
              public.filename-extension:
                - torrent
              public.mime-type:
                - application/x-bittorrent
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lodev09.neotorrent
        PRODUCT_NAME: NeoTorrent
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        SWIFT_INCLUDE_PATHS: "$(SRCROOT)/NeoTorrent/Generated"
        LIBRARY_SEARCH_PATHS: "$(SRCROOT)/NeoTorrent/Generated"
        OTHER_LDFLAGS: "-lneotorrent_ffi -lc++ -framework Security -framework SystemConfiguration"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    entitlements:
      path: NeoTorrent/NeoTorrent.entitlements
      properties:
        com.apple.security.app-sandbox: false
    preBuildScripts:
      # Debug stays optimized (SHA1 piece hashing is too slow unoptimized) but
      # skips fat LTO via the `dev-release` cargo profile.
      - name: Build Rust core
        script: |
          if [ "$CONFIGURATION" = "Release" ]; then
              export PROFILE=release
          else
              export PROFILE=dev-release
          fi
          exec "$SRCROOT/../../scripts/build-rust.sh"
        basedOnDependencyAnalysis: false
        outputFiles:
          - $(SRCROOT)/NeoTorrent/Generated/neotorrent_ffi.swift
          - $(SRCROOT)/NeoTorrent/Generated/neotorrent_ffiFFI.h
          - $(SRCROOT)/NeoTorrent/Generated/module.modulemap
          - $(SRCROOT)/NeoTorrent/Generated/libneotorrent_ffi.a
    scheme: {}
