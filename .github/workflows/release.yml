name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Create a GitHub release and upload the DMG (must run on a tag)'
        type: boolean
        default: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build + sign
    runs-on: macos-26
    timeout-minutes: 60
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Determine version
        id: version
        env:
          PUBLISH_INPUT: ${{ inputs.publish }}
        run: |
          VERSION="$(/usr/bin/sed -n 's/.*CFBundleShortVersionString: "\([^"]*\)".*/\1/p' apps/NeoTorrent/project.yml | head -n1)"
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            PUBLISH="true"
          else
            PUBLISH="$PUBLISH_INPUT"
          fi
          case "$GITHUB_REF" in
            refs/tags/*)
              TAG_VERSION="${GITHUB_REF_NAME#v}"
              if [ "$TAG_VERSION" != "$VERSION" ]; then
                echo "error: tag $GITHUB_REF_NAME does not match project.yml version $VERSION" >&2
                exit 1
              fi
              ;;
            *)
              if [ "$PUBLISH" = "true" ]; then
                echo "error: publishing requires running on a tag (got $GITHUB_REF)" >&2
                exit 1
              fi
              ;;
          esac
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION (publish=$PUBLISH)"

      - name: Set up Xcode + XcodeGen
        run: ./scripts/ci-setup-xcode.sh

      - name: Install Rust toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Generate Xcode project
        run: xcodegen generate --spec apps/NeoTorrent/project.yml

      # Built unsigned so no build code (cargo build scripts, the Run Script
      # phase) runs while the signing key is in the keychain.
      - name: Build app
        run: |
          xcodebuild \
            -project apps/NeoTorrent/NeoTorrent.xcodeproj \
            -scheme NeoTorrent \
            -configuration Release \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            clean build

      - name: Import signing certificate
        env:
          CERT_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERT_PASSWORD }}
        run: ./scripts/ci-import-cert.sh

      - name: Sign app
        run: |
          codesign \
            --force \
            --sign "Developer ID Application" \
            --options runtime \
            --timestamp \
            --entitlements apps/NeoTorrent/NeoTorrent/NeoTorrent.entitlements \
            build/Build/Products/Release/NeoTorrent.app

      - name: Delete keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/build.keychain-db" || true

      - name: Verify signature
        run: |
          APP="build/Build/Products/Release/NeoTorrent.app"
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dvv "$APP"

      - name: Archive signed app
        run: |
          APP="build/Build/Products/Release/NeoTorrent.app"
          /usr/bin/ditto -c -k --keepParent "$APP" "NeoTorrent-signed.zip"

      - name: Upload signed app artifact
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: neotorrent-signed-app
          path: NeoTorrent-signed.zip
          if-no-files-found: error
          retention-days: 14

  notarize:
    name: Notarize + package
    needs: build
    runs-on: macos-26
    timeout-minutes: 180
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Install packaging tools
        run: brew install create-dmg

      - name: Download signed app artifact
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: neotorrent-signed-app

      - name: Extract signed app
        run: |
          mkdir -p build/Build/Products/Release
          /usr/bin/ditto -x -k NeoTorrent-signed.zip build/Build/Products/Release

      - name: Notarize app
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          ./scripts/notarize.sh NeoTorrent-signed.zip
          xcrun stapler staple "build/Build/Products/Release/NeoTorrent.app"

      - name: Package DMG
        run: |
          APP_PATH="$PWD/build/Build/Products/Release/NeoTorrent.app" \
            ./scripts/package-dmg.sh

      - name: Import signing certificate
        env:
          CERT_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERT_PASSWORD }}
        run: ./scripts/ci-import-cert.sh

      - name: Sign DMG
        run: codesign --sign "Developer ID Application" --timestamp "dist/NeoTorrent-$VERSION.dmg"

      - name: Delete keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/build.keychain-db" || true

      - name: Notarize DMG
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          DMG="dist/NeoTorrent-$VERSION.dmg"
          ./scripts/notarize.sh "$DMG"
          xcrun stapler staple "$DMG"

      - name: Checksum DMG
        working-directory: dist
        run: shasum -a 256 "NeoTorrent-$VERSION.dmg" | tee "NeoTorrent-$VERSION.dmg.sha256"

      - name: Upload DMG artifact
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: NeoTorrent-${{ needs.build.outputs.version }}-dmg
          path: |
            dist/NeoTorrent-${{ needs.build.outputs.version }}.dmg
            dist/NeoTorrent-${{ needs.build.outputs.version }}.dmg.sha256
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: [build, notarize]
    if: needs.build.outputs.publish == 'true' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - name: Download DMG artifact
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: NeoTorrent-${{ needs.build.outputs.version }}-dmg

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG="$GITHUB_REF_NAME"
          ASSETS=("NeoTorrent-$VERSION.dmg" "NeoTorrent-$VERSION.dmg.sha256")
          if gh release view "$TAG" >/dev/null 2>&1; then
            # No --clobber: fail rather than replace an already-published asset.
            gh release upload "$TAG" "${ASSETS[@]}"
          else
            gh release create "$TAG" \
              --verify-tag \
              --target "$GITHUB_SHA" \
              --title "$TAG" \
              --generate-notes \
              "${ASSETS[@]}"
          fi
