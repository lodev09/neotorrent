name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Create a GitHub release and upload the DMG'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    name: Build + sign
    runs-on: macos-26
    timeout-minutes: 60
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode 26
        run: |
          XCODE="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort | tail -n1)"
          if [ -z "$XCODE" ]; then
            echo "error: no Xcode 26 found in /Applications" >&2
            ls /Applications | grep -i xcode || true
            exit 1
          fi
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Determine version
        id: version
        run: |
          VERSION="$(/usr/bin/sed -n 's/.*CFBundleShortVersionString: "\([^"]*\)".*/\1/p' apps/NeoTorrent/project.yml | head -n1)"
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG_VERSION="${GITHUB_REF_NAME#v}"
            if [ "$TAG_VERSION" != "$VERSION" ]; then
              echo "error: tag $GITHUB_REF_NAME does not match project.yml version $VERSION" >&2
              exit 1
            fi
            PUBLISH="true"
          else
            PUBLISH="${{ inputs.publish }}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION (publish=$PUBLISH)"

      - name: Install build tools
        run: brew install xcodegen just

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - uses: Swatinem/rust-cache@v2

      - name: Import signing certificate
        env:
          CERT_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: ./scripts/ci-import-cert.sh

      - name: Build Rust core + bindings
        run: PROFILE=release ./scripts/build-rust.sh

      - name: Generate Xcode project
        working-directory: apps/NeoTorrent
        run: xcodegen generate

      - name: Build signed app
        env:
          DEVELOPMENT_TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcodebuild \
            -project apps/NeoTorrent/NeoTorrent.xcodeproj \
            -scheme NeoTorrent \
            -configuration Release \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath build \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Developer ID Application" \
            DEVELOPMENT_TEAM="$DEVELOPMENT_TEAM" \
            CODE_SIGN_INJECT_BASE_ENTITLEMENTS=NO \
            OTHER_CODE_SIGN_FLAGS="--timestamp --options runtime" \
            clean build

      - name: Verify signature
        run: |
          APP="build/Build/Products/Release/NeoTorrent.app"
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dvv "$APP"

      - name: Archive signed app
        run: |
          APP="build/Build/Products/Release/NeoTorrent.app"
          /usr/bin/ditto -c -k --keepParent "$APP" "NeoTorrent-signed.zip"

      - name: Upload signed app artifact
        uses: actions/upload-artifact@v5
        with:
          name: neotorrent-signed-app
          path: NeoTorrent-signed.zip
          if-no-files-found: error
          retention-days: 14

      - name: Cleanup keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/build.keychain-db" || true

  notarize:
    name: Notarize + package + release
    needs: build
    runs-on: macos-26
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5

      - name: Install packaging tools
        run: brew install create-dmg

      - name: Download signed app artifact
        uses: actions/download-artifact@v5
        with:
          name: neotorrent-signed-app

      - name: Extract signed app
        run: |
          mkdir -p build/Build/Products/Release
          /usr/bin/ditto -x -k NeoTorrent-signed.zip build/Build/Products/Release

      - name: Notarize app
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          ./scripts/notarize.sh NeoTorrent-signed.zip
          xcrun stapler staple "build/Build/Products/Release/NeoTorrent.app"

      - name: Import signing certificate (for DMG)
        env:
          CERT_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: ./scripts/ci-import-cert.sh

      - name: Package DMG
        run: |
          APP_PATH="$PWD/build/Build/Products/Release/NeoTorrent.app" \
            VERSION="${{ needs.build.outputs.version }}" \
            ./scripts/package-dmg.sh

      - name: Sign + notarize DMG
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          DMG="dist/NeoTorrent-${{ needs.build.outputs.version }}.dmg"
          codesign --sign "Developer ID Application" --timestamp "$DMG"
          ./scripts/notarize.sh "$DMG"
          xcrun stapler staple "$DMG"

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v5
        with:
          name: NeoTorrent-${{ needs.build.outputs.version }}-dmg
          path: dist/NeoTorrent-${{ needs.build.outputs.version }}.dmg
          if-no-files-found: error

      - name: Create GitHub release
        if: needs.build.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ needs.build.outputs.version }}"
          TAG="v$VERSION"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --title "$TAG" \
              --generate-notes \
              "dist/NeoTorrent-$VERSION.dmg"
          else
            gh release upload "$TAG" "dist/NeoTorrent-$VERSION.dmg" --clobber
          fi

      - name: Cleanup keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/build.keychain-db" || true
