[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
edition = "2021"
version = "0.1.0"
authors = ["Jovanni Lo <lodev09@gmail.com>"]
license = "MIT"

[workspace.dependencies]
uniffi = { version = "0.28", features = ["tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros", "net", "time", "io-util"] }
tokio-tungstenite = { version = "0.24", features = ["connect", "native-tls"] }
webrtc = "0.12"
bytes = "1"
serde_bencode = "0.2"
serde_bytes = "0.11"
sha1 = "0.10"
librqbit = { version = "8", features = ["http-api", "tracing-subscriber-utils"] }
anyhow = "1"
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
url = "2"
rand = "0.8"
thiserror = "1"
form_urlencoded = "1"

[profile.release]
lto = true
codegen-units = 1
strip = true
